	SPDX-License-Identifier: AGPL-3.0-or-later

	Bundled, not fetched. SPEC §9 forbids an icon CDN, and that applies to the favicon as
	much as to item icons: a remote favicon is a request that tells a third party when the
	vault was opened.

	The embedded stylesheet is scoped to this document and is not affected by the page's
	CSP, which governs the containing document rather than an SVG loaded as an image.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Misty">
	<style>
		.mark { fill: #1d4ed8; }
		.fog { fill: #ffffff; opacity: 0.92; }
		@media (prefers-color-scheme: dark) {
			.mark { fill: #8fb4ff; }
			.fog { fill: #0f1216; opacity: 0.94; }
		}
	</style>
	<!-- A shield: the vault. -->
	<path class="mark" d="M16 2 4 6.5v9.2C4 23 9.2 28.4 16 30c6.8-1.6 12-7 12-14.3V6.5L16 2Z" />
	<!-- Three bands of mist across it: the name, and the point — what is inside is not legible. -->
	<rect class="fog" x="7.5" y="12" width="17" height="2.4" rx="1.2" />
	<rect class="fog" x="9.5" y="16.4" width="13" height="2.4" rx="1.2" />
	<rect class="fog" x="11.5" y="20.8" width="9" height="2.4" rx="1.2" />
</svg>
