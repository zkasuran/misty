[package]
name = "misty-otp"
description = "One-time-password engine: RFC 4226 HOTP, RFC 6238 TOTP, Steam, mOTP, Blizzard and Yandex variants, plus otpauth:// URI parsing and serialization."
readme = "README.md"
keywords = ["otp", "totp", "hotp", "2fa", "otpauth"]
categories = ["authentication", "cryptography"]
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
rust-version.workspace = true

[dependencies]
# HMAC + hashes. Interop only: these are dictated by the OTP standards, not chosen.
hmac = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
# mOTP is specified in terms of MD5. Broken as a hash; required for interop.
md-5 = { version = "0.11", default-features = false }
# Constant-time comparison of generated codes (SPEC 2.1).
subtle = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
# mOTP secrets are hex, not base32.
hex = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
hex-literal = { workspace = true }
# Re-implements the documented mOTP formula in tests/variants.rs, so the test
# pins the concatenation order rather than restating the implementation.
md-5 = { version = "0.11", default-features = false }
