[package]
name = "misty-vault-fuzz"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

# Deliberately its own workspace root: `cargo-fuzz` needs a nightly toolchain and
# its own profile, and the root workspace must not try to build it. The directory
# is also excluded from the published crate by `exclude = ["fuzz"]`.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
misty-vault = { path = ".." }

[[bin]]
name = "item_decode"
path = "fuzz_targets/item_decode.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true
