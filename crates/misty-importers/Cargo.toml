[package]
name = "misty-importers"
description = "Offline importers for every competitor 2FA export format, and otpauth:// / plaintext JSON export."
readme = "README.md"
keywords = ["2fa", "totp", "import", "aegis", "otpauth"]
categories = ["authentication", "parser-implementations"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# `fuzz/` is a separate workspace with a nightly-only dependency; it is not part
# of the published crate.
exclude = ["fuzz"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# The model this crate imports into, and the `otpauth://` parser it delegates to.
# Deliberately no dependency on `misty-vault`: this crate emits plain values and
# lets the caller insert them, so it is testable without a vault and independent
# of Phase 2.
# Version as well as path: a bare path dependency is a wildcard requirement, and
# `cargo deny`'s `bans.wildcards = "deny"` refuses those — a published crate with a
# wildcard dependency cannot be depended on reproducibly.
misty-otp = { path = "../misty-otp", version = "0.1.0" }

# --- encoding ---
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
# FreeOTP's Android `tokens.xml` and KeePassXC's XML export. Pure Rust, no C, so
# the wasm32 build survives; `default-features = false` keeps `encoding_rs` (and
# its tables) out. Not in [workspace.dependencies], so pinned here.
#
# 0.41 is a floor, not a preference: 0.38 and earlier carry RUSTSEC-2026-0194
# (quadratic time when checking a start tag for duplicate attribute names) and an
# unbounded namespace-declaration allocation in `NsReader`. Both land squarely on
# this crate's threat model — the whole promise here is that a malicious import file
# cannot hurt the user — so the floor is enforced rather than an advisory being
# ignored. `tests/hostile_inputs.rs` covers both shapes directly.
quick-xml = { version = "0.41.0", default-features = false }

# --- interop cryptography ---
# These are NOT Misty's own primitives (SPEC 2.1 fixes those). They exist only to
# open other applications' encrypted exports, and every one of them is pure Rust
# so this crate still builds for wasm32-unknown-unknown — the browser extension
# imports files too.
#
# AES-256-GCM: Aegis and andOTP encrypted backups.
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "alloc"] }
# scrypt: Aegis's vault KDF.
scrypt = { version = "0.11.0", default-features = false }
# PBKDF2: andOTP's KDF (HMAC-SHA-1) and the SHA-256 variants other apps use.
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
hmac = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }

# --- secrets / errors ---
zeroize = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Nothing else: a test target already sees every `[dependencies]` entry, and the
# encrypted fixtures are generated by `tests/fixture_provenance.rs` with the same
# `aes-gcm`, `scrypt` and `pbkdf2` the importers decrypt with — at fixed salts and
# nonces, so the committed bytes are reproducible rather than magic.
