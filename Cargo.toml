[workspace]
resolver = "2"
# Members are listed explicitly rather than globbed. A glob pattern that matches
# nothing is a hard error in cargo — `server/*` broke the whole workspace before
# the server crate existed — and an explicit list also stops a stray directory
# from silently joining the build. Add each crate here as its phase lands.
members = [
  "crates/misty",
  "crates/misty-crypto",
  "crates/misty-ffi",
  "crates/misty-importers",
  "crates/misty-otp",
  "crates/misty-sync",
  "crates/misty-vault",
  "server/misty-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/zkasuran/misty"
rust-version = "1.85"

[workspace.dependencies]
# --- crypto (pure Rust: must compile to wasm32-unknown-unknown) ---
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
blake2 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
sha1 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", default-features = false }
getrandom = "0.2"

# --- encoding ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
data-encoding = "2"
hex = "0.4"
base64 = "0.22"
percent-encoding = "2"
url = "2"

# --- errors / utils ---
thiserror = "2"
tracing = "0.1"

# --- dev / test ---
proptest = "1"
hex-literal = "1.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package."*"]
opt-level = 3
