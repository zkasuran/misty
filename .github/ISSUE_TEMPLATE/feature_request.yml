name: Feature request
description: Suggest a capability
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What problem does this solve
      description: Describe the situation you are in, not the implementation you have in mind.
    validations:
      required: true

  - type: textarea
    attributes:
      label: How do other authenticators handle it
      description: |
        Authy, Google Authenticator, Aegis, 2FAS, Ente Auth, Yubico Authenticator,
        a password manager's TOTP feature — what do they do well or badly here?

  - type: textarea
    attributes:
      label: Security implications
      description: |
        Does this widen the threat model in docs/SPEC.md §1? Anything that moves
        secrets somewhere new, relaxes a lock, or adds a network endpoint needs an
        honest answer here. "I don't know" is a fine answer.

  - type: checkboxes
    attributes:
      label: Scope check
      options:
        - label: I have read docs/ROADMAP.md and this is not already planned
        - label: This does not require storing passwords (explicitly out of scope for v1)
        - label: This does not require any telemetry or analytics
          required: true
