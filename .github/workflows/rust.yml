name: rust

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` is here so the `apple` job's opt-in actually works. Without it the
    # default set is [opened, synchronize, reopened], and a reviewer who adds the label
    # to request the macOS run gets nothing at all — the gate would look declined rather
    # than never asked. `unlabeled` is deliberately absent: removing a label should not
    # burn a runner.
    types: [opened, synchronize, reopened, labeled]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps
      - name: every facade method reaches both bindings (SPEC §11.7)
        # Cheap, source-level, and it catches the mistake the conformance legs cannot:
        # adding a facade method and wiring it to only one toolchain. The legs would
        # still pass — they would just be exercising two different surfaces.
        run: python3 ci/check-binding-parity.py

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: every core crate builds for wasm32
        run: |
          set -euo pipefail
          # The crate list is derived from the workspace rather than hardcoded, so a
          # new crate cannot silently escape this gate and a renamed one cannot turn
          # the job into a no-op that still reports green. Only crates that genuinely
          # cannot target wasm belong in the skip list.
          skip='misty-server'
          crates=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(" ".join(p["name"] for p in json.load(sys.stdin)["packages"]))')
          echo "workspace crates: $crates"
          for c in $crates; do
            case " $skip " in *" $c "*) echo "skipping $c (documented non-wasm target)"; continue;; esac
            echo "::group::$c"
            cargo build -p "$c" --target wasm32-unknown-unknown
            echo "::endgroup::"
          done

  bindings:
    # The two UniFFI legs of the SPEC §11.8.2 conformance gate (§11.7.1): the generated
    # Swift and the generated Kotlin, both *executed*, not merely generated.
    #
    # Both run on Linux on purpose. Neither foreign toolchain is platform-locked for this
    # purpose — swift.org ships Linux Swift, and UniFFI's Kotlin output binds through JNA
    # on any JVM — so both legs run on the cheap runner on every pull request. What
    # genuinely needs macOS is the Apple *platform* artifact, and that is the `apple` job.
    #
    # "Generation succeeded" is not the gate and must never be mistaken for it. Compiling
    # the generated Kotlin is what caught the `message` field colliding with
    # `kotlin.Exception.message`; generation had reported success on code that does not
    # build. Running it is what proves Kotlin computes the same answers as everyone else.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: cache the conformance toolchains
        uses: actions/cache@v4
        with:
          # Only the downloaded toolchain, never the build outputs beside it: caching
          # `bindings/` or `classes/` would let a stale generated file survive into a run
          # that should have regenerated it. Keyed on the script, since that pins the
          # versions.
          path: |
            target/conformance-kotlin/jars
            target/conformance-kotlin/kotlinc-*
          key: conformance-kotlin-${{ hashFiles('crates/misty-ffi/conformance/run-kotlin.sh') }}
      - name: the generated Swift runs the §11.8.2 conformance flow
        # Builds the cdylib, generates Swift from that artifact, compiles it with
        # conformance/ConformanceFlow.swift, and runs the flow. Same script a developer
        # runs locally, so a green CI here means a green checkout there.
        run: crates/misty-ffi/conformance/run-swift.sh
      - name: the generated Kotlin runs the §11.8.2 conformance flow
        run: crates/misty-ffi/conformance/run-kotlin.sh

  wasm-conformance:
    # The wasm leg of the SPEC §11.8.2 gate: `tests/web.rs` executed in a real headless
    # browser, driving the `web::MistyFacade` surface JavaScript actually holds — the
    # serde lowering, the `Promise` wrapping, and the `{ code, message, retryable }`
    # rejection, none of which a Rust-level test touches.
    #
    # Separate from the `wasm` job above so a failure is attributable: that job answers
    # "does every crate still compile for wasm32", this one answers "does the browser
    # binding still compute the right answers".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cache the browser driver and test runner
        uses: actions/cache@v4
        with:
          path: |
            target/conformance-wasm/chromedriver-*
            target/wasm-bindgen-*
          key: conformance-wasm-${{ hashFiles('crates/misty-ffi/conformance/run-wasm.sh', 'ci/wasm-bindgen.sh', 'Cargo.lock') }}
      - name: the wasm bundle runs the §11.8.2 conformance flow in headless Chrome
        # The script discovers the runner's Chrome, fetches a chromedriver whose major
        # version matches it, and fetches the wasm-bindgen-test-runner pinned in
        # Cargo.lock. Matching those three is the entire difficulty: a mismatch surfaces
        # as a bare `http status: 404` from the test runner with the real cause only in
        # the driver log, which is why the script pins rather than hopes.
        run: crates/misty-ffi/conformance/run-wasm.sh

  ui:
    # P6's exit gate: full flows against the mock core, and an a11y audit clean in light and
    # dark.
    #
    # "Against the mock core" is not a figure of speech — the browser loads the real Rust
    # vault compiled to WebAssembly (SPEC §11.8.1), so these flows exercise the real CRDT
    # merge and the real envelope layer. There is no stubbed API to keep in step, which is
    # exactly why §11.8.1 forbids a hand-written TypeScript mock.
    #
    # Everything runs against the *production build* via `vite preview`. The SPEC §9 CSP only
    # exists in built output, and the dev server injects styles inline, so testing dev would
    # pass while shipping something different.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - run: npm ci
      - name: cache the wasm-bindgen CLI
        uses: actions/cache@v4
        with:
          path: target/wasm-bindgen-*
          key: wasm-bindgen-${{ hashFiles('Cargo.lock', 'ci/wasm-bindgen.sh') }}
      - run: npx playwright install --with-deps chromium
      - name: types and Svelte templates check
        run: npm run check
      - name: full flows and the a11y audit
        # `npm test` builds the release core, builds the app, and runs both specs.
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-playwright-report
          path: |
            apps/ui/playwright-report
            apps/ui/test-results
          if-no-files-found: ignore

  apple:
    # The Apple platform artifact: the `.xcframework` slices the iOS and macOS shells
    # link, plus the §11.8.2 flow run through Swift on a real Apple toolchain
    # (ROADMAP P7/P8). `xcodebuild -create-xcframework` and the iOS SDKs exist only
    # here, which is the entire reason this job is separate from `bindings`.
    #
    # A macOS runner costs ten times a Linux one, so this is gated to `main` and to
    # pull requests that touch the binding layer. `bindings` still runs on everything.
    runs-on: macos-latest
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'apple')
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: the workspace builds and tests on macOS
        run: cargo test --workspace --all-features
      - name: the generated Swift runs the §11.8.2 conformance flow on an Apple toolchain
        run: crates/misty-ffi/conformance/run-swift.sh --release
      - name: Misty.xcframework assembles for iOS device, iOS simulator, and macOS
        run: crates/misty-ffi/apple/build-xcframework.sh
      - uses: actions/upload-artifact@v4
        with:
          name: misty-apple-xcframework
          path: |
            target/apple/Misty.xcframework
            target/apple/Sources
            target/apple/Package.swift
          if-no-files-found: error

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: smoke-fuzz every target
        run: |
          set -euo pipefail
          # Bounded runs: this proves the targets still build and catches regressions
          # that panic quickly. It is not a substitute for long fuzzing sessions.
          # --sanitizer=none is deliberate: every crate is #![forbid(unsafe_code)], so
          # the bugs these targets find are panics and over-allocation, not memory
          # errors, and ASan only costs throughput here.
          found=0
          for d in crates/*/fuzz server/*/fuzz; do
            [ -d "$d" ] || continue
            crate=$(dirname "$d")
            for t in "$d"/fuzz_targets/*.rs; do
              [ -f "$t" ] || continue
              found=1
              name=$(basename "$t" .rs)
              echo "::group::$crate :: $name"
              (cd "$crate" && cargo fuzz run --sanitizer=none "$name" -- -max_total_time=60)
              echo "::endgroup::"
            done
          done
          if [ "$found" = 0 ]; then
            echo "no fuzz targets found — SPEC §10 requires them for every parser"
            exit 1
          fi

  licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: every file has machine-readable copyright and license info
        run: |
          python3 -m venv /tmp/reuse-venv
          /tmp/reuse-venv/bin/pip install --quiet reuse
          /tmp/reuse-venv/bin/reuse lint
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: misty-otp stays permissively licensed, dependencies included
        run: python3 ci/check-otp-permissive.py

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
